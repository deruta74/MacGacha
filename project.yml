name: MacGacha
options:
  developmentLanguage: en
  deploymentTarget:
    macOS: "27.0"
packages:
  LauncherKit:
    path: Packages/LauncherKit
targets:
  MacGacha:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: App
        excludes: [Resources]
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: LauncherKit
        product: LauncherCore
      - package: LauncherKit
        product: DownloadEngine
      - package: LauncherKit
        product: Diagnostics
      - package: LauncherKit
        product: HoYoPlayAPI
      - package: LauncherKit
        product: Sophon
      - package: LauncherKit
        product: GameLibrary
      - package: LauncherKit
        product: Launch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lo7ted.macgacha
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: App/MacGacha.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MacGacha
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 deruta74. GPL-3.0."
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        # New user-facing strings land in App/Resources/Localizable.xcstrings at build time.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  MacGachaTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: MacGachaTests
    dependencies:
      - target: MacGacha
      - package: LauncherKit
        product: LauncherCore
      - package: LauncherKit
        product: DownloadEngine
      - package: LauncherKit
        product: Diagnostics
      - package: LauncherKit
        product: HoYoPlayAPI
      - package: LauncherKit
        product: Sophon
      - package: LauncherKit
        product: GameLibrary
      - package: LauncherKit
        product: Launch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lo7ted.macgacha.tests
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
schemes:
  MacGacha:
    build:
      targets:
        MacGacha: all
    test:
      targets:
        - MacGachaTests
