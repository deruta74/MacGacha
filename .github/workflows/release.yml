name: Release (draft)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release name, for example 0.1.1-beta. The numeric part must match MARKETING_VERSION in project.yml.
        required: true
        type: string
permissions:
  contents: read
jobs:
  draft:
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write # Only the final draft-release step uses this token.
      actions: read # Reads the CI result for the released commit.
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the branch and release name
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "error: run this workflow on main, not $GITHUB_REF" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "error: release name must look like 0.1.1 or 0.1.1-beta, got: $VERSION" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release notes
        run: |
          set -euo pipefail
          numeric_version="${VERSION%%-*}"
          notes_file="ReleaseNotes/$numeric_version.md"
          python3 -I scripts/make-appcast.py --check-notes "$notes_file"
          echo "RELEASE_NOTES=$notes_file" >> "$GITHUB_ENV"

      # A draft creates its tag only when published, so check both.
      - name: Check that the release does not exist yet
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "error: release $tag already exists" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "error: tag $tag already exists" >&2
            exit 1
          fi

      - name: Require green CI on this commit
        run: |
          set -euo pipefail
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --event push --limit 1 --json conclusion --jq '.[0].conclusion // ""')
          if [[ "$conclusion" != "success" ]]; then
            echo "error: CI for $GITHUB_SHA is '${conclusion:-not finished}', wait for it to pass" >&2
            exit 1
          fi

      - name: Validate update key and set build number
        run: |
          set -euo pipefail
          public_key=$(ruby -ryaml -e 'puts YAML.load_file("project.yml").fetch("targets").fetch("MacGacha").fetch("settings").fetch("base").fetch("SPARKLE_PUBLIC_ED_KEY")')
          python3 -I scripts/make-appcast.py --check-public-key "$public_key"
          echo "MACGACHA_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "MACGACHA_DERIVED_DATA_PATH=$RUNNER_TEMP/macgacha-release-dd" >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the disk image
        run: scripts/package-dmg.sh "$VERSION" out

      - name: Sign update and generate appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]]; then
            echo "error: SPARKLE_ED_PRIVATE_KEY is not configured" >&2
            exit 1
          fi
          signer=$(find "$MACGACHA_DERIVED_DATA_PATH/SourcePackages/artifacts" -type f -path '*/bin/sign_update' -print -quit)
          if [[ -z "$signer" || ! -x "$signer" ]]; then
            echo "error: Sparkle sign_update was not found in the resolved artifacts" >&2
            exit 1
          fi
          umask 077
          key_file=$(mktemp "$RUNNER_TEMP/macgacha-sparkle-key.XXXXXX")
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key_file"
          unset SPARKLE_ED_PRIVATE_KEY
          if ! signature=$("$signer" --ed-key-file "$key_file" -p "out/MacGacha-$VERSION.dmg" 2>/dev/null); then
            echo "error: Sparkle could not sign the update" >&2
            exit 1
          fi
          public_key=$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$MACGACHA_DERIVED_DATA_PATH/Build/Products/Release/MacGacha.app/Contents/Info.plist")
          xcrun swift -warnings-as-errors scripts/verify-sparkle-signature.swift "out/MacGacha-$VERSION.dmg" "$public_key" "$signature"
          python3 -I scripts/make-appcast.py --release "$VERSION" --build-number "$MACGACHA_BUILD_NUMBER" \
            --dmg "out/MacGacha-$VERSION.dmg" --signature "$signature" --notes "$RELEASE_NOTES" --output out/appcast.xml
          python3 -I -c 'import xml.etree.ElementTree as ET; ET.parse("out/appcast.xml")'

      - name: Create the draft release
        run: |
          set -euo pipefail
          tag="v$VERSION"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft \
            --title "MacGacha ${VERSION/-/ }" --target "$GITHUB_SHA" --notes-file "$RELEASE_NOTES" \
            "out/MacGacha-$VERSION.dmg" "out/MacGacha-$VERSION.dmg.sha256" "out/appcast.xml"
          echo "Draft release $tag is ready. Edit its notes and publish it on GitHub." >> "$GITHUB_STEP_SUMMARY"
