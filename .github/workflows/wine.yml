name: Wine candidate (manual build)
on:
  workflow_dispatch:
    inputs:
      prepare_draft_release:
        description: Attach verified Wine 1.0 and complete sources to a draft prerelease
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 240
    permissions:
      contents: write # Only the explicit draft attachment step uses the token.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check source and packaging contracts
        run: |
          python3 -I scripts/test-prepare-wine-release.py
          python3 -I scripts/test-wine-build.py
          python3 -I scripts/test-wine-dependencies.py
          python3 -I scripts/test-wine-dependency-build.py
          python3 -I scripts/test-finalize-source-wine.py
      - name: Fetch checksum-pinned inputs
        run: |
          python3 -I scripts/build-wine-dependencies.py "$RUNNER_TEMP/deps-a" --cache "$RUNNER_TEMP/deps-cache" --fetch-only
          python3 -I scripts/build-wine.py "$RUNNER_TEMP/wine-a" --dependencies "$RUNNER_TEMP/deps-a" --cache "$RUNNER_TEMP/wine-cache" --fetch-only
      - name: Build twice offline and compare packages
        run: |
          set -euo pipefail
          profile='(version 1) (allow default) (deny network*) (deny file-read* (subpath "/opt/homebrew")) (deny file-write* (subpath "/opt/homebrew"))'
          for suffix in a b; do
            sandbox-exec -p "$profile" python3 -I scripts/build-wine-dependencies.py "$RUNNER_TEMP/deps-$suffix" --cache "$RUNNER_TEMP/deps-cache" --offline
            sandbox-exec -p "$profile" python3 -I scripts/build-wine.py "$RUNNER_TEMP/wine-$suffix" --dependencies "$RUNNER_TEMP/deps-$suffix" --cache "$RUNNER_TEMP/wine-cache" --offline --bison "$RUNNER_TEMP/deps-$suffix/tools/bin/bison"
            python3 -I scripts/finalize-source-wine.py "$RUNNER_TEMP/wine-$suffix" "$RUNNER_TEMP/wine-final-$suffix"
          done
          cmp "$RUNNER_TEMP/wine-final-a/11.20-macgacha1-preview4.tar.xz" "$RUNNER_TEMP/wine-final-b/11.20-macgacha1-preview4.tar.xz"
      - name: Probe the unpacked candidate
        run: python3 -I scripts/check-wine.py "$RUNNER_TEMP/wine-final-a" "$RUNNER_TEMP/wine-probe" --deny-read "$RUNNER_TEMP/deps-a" --deny-read "$RUNNER_TEMP/deps-b"
      # Evidence is public in this public repository. Do not distribute binaries
      # or source bundles from this qualification workflow.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wine-build-evidence
          path: |
            ${{ runner.temp }}/wine-a/*.json
            ${{ runner.temp }}/wine-a/*.log
            ${{ runner.temp }}/wine-a/SHA256SUMS
            ${{ runner.temp }}/wine-final-a/receipt.json
            ${{ runner.temp }}/wine-final-a/SHA256SUMS
            ${{ runner.temp }}/deps-a/receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Prepare verified Wine 1.0 release assets
        if: inputs.prepare_draft_release
        run: python3 -I scripts/prepare-wine-release.py "$RUNNER_TEMP/wine-final-a" "$RUNNER_TEMP/wine-release"
      - name: Attach binary and complete sources to a draft prerelease
        if: inputs.prepare_draft_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=wine-11.20-macgacha-1.0
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --prerelease --latest=false --title 'MacGacha Wine 11.20 — Version 1.0' --target "$GITHUB_SHA" --notes-file compat/wine/SOURCE-NOTICE.md
          fi
          [[ $(gh release view "$tag" --json isDraft --jq .isDraft) == true ]] || {
            echo 'Refusing to change a published release' >&2
            exit 1
          }
          gh release edit "$tag" --prerelease --latest=false
          gh release upload "$tag" "$RUNNER_TEMP/wine-release/"* --clobber
