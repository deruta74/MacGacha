name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check license headers
        run: scripts/check-headers.sh

      - name: Run package tests
        run: |
          mkdir -p test-results
          swift test --package-path Packages/LauncherKit --parallel --xunit-output test-results/test-results.xml

      - name: Generate Xcode project
        run: scripts/bootstrap.sh

      - name: Build app
        run: >-
          xcodebuild
          -project MacGacha.xcodeproj
          -scheme MacGacha
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath .build/xcode
          CODE_SIGN_IDENTITY=-
          build

      - name: Archive app
        run: ditto -c -k --keepParent .build/xcode/Build/Products/Release/MacGacha.app MacGacha.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacGacha-${{ github.sha }}
          path: MacGacha.zip
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: test-results/*.xml
