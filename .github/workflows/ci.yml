name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Three independent jobs run in parallel; each builds what it needs from a
# clean checkout, so no job waits for another.
jobs:
  package-tests:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check license headers
        run: scripts/check-headers.sh

      - name: Check appcast generator and update signature verifier
        run: |
          python3 -I scripts/make-appcast.py --self-check
          xcrun swift -warnings-as-errors scripts/verify-sparkle-signature.swift --self-check

      - name: Run package tests
        run: |
          mkdir -p test-results
          python3 scripts/test-package.py --events test-results/package-events.jsonl \
            --parallel --xunit-output test-results/test-results.xml
      # Scale tests hold the only cooperative thread for tens of seconds and
      # starve timed tests; they already run in the step above.
      - name: Run engine tests with one cooperative worker
        timeout-minutes: 5
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: '1'
        run: |
          python3 scripts/test-package.py --events test-results/strict-engine-events.jsonl \
            --timeout-seconds 240 --skip-build --test-product DownloadEngineTests \
            --skip PlanScaleTests --skip operationStagesOneThousandBatchesWithLinearWork \
            --parallel --num-workers 2 --xunit-output test-results/strict-engine.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-results-${{ github.sha }}
          path: |
            test-results/*.xml
            test-results/*.jsonl
            test-results/*.sample-*.txt

  app-tests:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: scripts/bootstrap.sh

      - name: Run app unit tests
        run: >-
          xcodebuild
          -project MacGacha.xcodeproj
          -scheme MacGacha
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath .build/xcode
          -resultBundlePath test-results/MacGachaTests.xcresult
          CODE_SIGN_IDENTITY=-
          test

      - name: Check string catalog
        run: python3 scripts/check-strings.py .build/xcode

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results-${{ github.sha }}
          path: test-results/*.xcresult

  release-build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: scripts/bootstrap.sh

      - name: Build app
        run: >-
          xcodebuild
          -project MacGacha.xcodeproj
          -scheme MacGacha
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath .build/xcode
          CODE_SIGN_IDENTITY=-
          build

      - name: Archive app
        run: ditto -c -k --keepParent .build/xcode/Build/Products/Release/MacGacha.app MacGacha.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacGacha-${{ github.sha }}
          path: MacGacha.zip
          retention-days: 14
