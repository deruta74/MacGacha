name: Runtime catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [RuntimeCatalog/runtime-catalog.json]
permissions:
  contents: read
concurrency:
  group: runtime-catalog-v1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require main and green CI
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          for attempt in $(seq 1 90); do
            conclusion=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json conclusion --jq '.[0].conclusion // ""')
            [[ "$conclusion" == success ]] && break
            [[ -z "$conclusion" ]] || { echo "CI did not pass" >&2; exit 1; }
            sleep 10
          done
          [[ "$conclusion" == success ]]
          [[ $(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha) == "$GITHUB_SHA" ]]
      - name: Validate monotonic catalog and new assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/test-runtime-catalog.py
          mkdir -p previous/channel previous/snapshot
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > previous/releases.json
          python3 -I scripts/check-runtime-catalog.py RuntimeCatalog/runtime-catalog.json --publication-index previous/releases.json > previous/state.json
          args=(--resume-identical)
          if [[ $(python3 -c 'import json; print(json.load(open("previous/state.json"))["channelHasAsset"])') == True ]]; then
            gh release download runtime-catalog-v1 --pattern runtime-catalog.json --dir previous/channel
            args+=(--previous previous/channel/runtime-catalog.json)
          fi
          latest=$(python3 -c 'import json; print(json.load(open("previous/state.json"))["latestCompleteSnapshot"] or "")')
          if [[ -n "$latest" ]]; then
            gh release download "$latest" --pattern runtime-catalog.json --dir previous/snapshot
            args+=(--previous previous/snapshot/runtime-catalog.json)
          fi
          python3 -I scripts/check-runtime-catalog.py RuntimeCatalog/runtime-catalog.json "${args[@]}" --verify-assets
          echo "CATALOG_REVISION=$(python3 -c 'import json; print(json.load(open("RuntimeCatalog/runtime-catalog.json"))["revision"])')" >> "$GITHUB_ENV"
      - name: Sign the exact catalog bytes
        env:
          RUNTIME_CATALOG_ED_PRIVATE_KEY: ${{ secrets.RUNTIME_CATALOG_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          export RUNTIME_CATALOG_PUBLIC_ED_KEYS=$(ruby -ryaml -e 'puts YAML.load_file("project.yml").fetch("targets").fetch("MacGacha").fetch("settings").fetch("base").fetch("RUNTIME_CATALOG_PUBLIC_ED_KEYS")')
          python3 -I scripts/check-runtime-catalog-keys.py "$RUNTIME_CATALOG_PUBLIC_ED_KEYS"
          swift scripts/sign-runtime-catalog.swift RuntimeCatalog/runtime-catalog.json RuntimeCatalog/runtime-catalog.json.sig
      - name: Publish immutable revision and promote channel
        shell: bash
        run: |
          set -euo pipefail
          [[ $(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha) == "$GITHUB_SHA" ]]
          snapshot="runtime-catalog-v1-r$CATALOG_REVISION"
          # Never overwrite a historical revision. A retry can reuse only identical bytes.
          if gh release view "$snapshot" >/dev/null 2>&1; then
            [[ $(gh release view "$snapshot" --json isDraft --jq .isDraft) == false ]]
            if [[ $(gh release view "$snapshot" --json assets --jq 'any(.assets[]; .name == "runtime-catalog.json")') == true ]]; then
              mkdir existing
              gh release download "$snapshot" --pattern runtime-catalog.json --dir existing
              cmp RuntimeCatalog/runtime-catalog.json existing/runtime-catalog.json
              if [[ $(gh release view "$snapshot" --json assets --jq 'any(.assets[]; .name == "runtime-catalog.json.sig")') == true ]]; then
                gh release download "$snapshot" --pattern runtime-catalog.json.sig --dir existing
                RUNTIME_CATALOG_PUBLIC_ED_KEYS=$(ruby -ryaml -e 'puts YAML.load_file("project.yml").fetch("targets").fetch("MacGacha").fetch("settings").fetch("base").fetch("RUNTIME_CATALOG_PUBLIC_ED_KEYS")') swift scripts/verify-runtime-catalog.swift existing/runtime-catalog.json existing/runtime-catalog.json.sig
              else
                gh release upload "$snapshot" RuntimeCatalog/runtime-catalog.json.sig
              fi
            else
              # A prior release-create may have succeeded before its upload failed.
              gh release upload "$snapshot" RuntimeCatalog/runtime-catalog.json RuntimeCatalog/runtime-catalog.json.sig
            fi
          else
            gh release create "$snapshot" --target "$GITHUB_SHA" --latest=false --title "Runtime catalog revision $CATALOG_REVISION" --notes "Compatible runtime component catalog. This is not an application update." RuntimeCatalog/runtime-catalog.json RuntimeCatalog/runtime-catalog.json.sig
          fi
          if ! gh release view runtime-catalog-v1 >/dev/null 2>&1; then
            gh release create runtime-catalog-v1 --target "$GITHUB_SHA" --latest=false --title "Runtime catalog" --notes "Current compatible runtime component catalog. Previous installed versions remain available for rollback." RuntimeCatalog/runtime-catalog.json RuntimeCatalog/runtime-catalog.json.sig
          else
            [[ $(gh release view runtime-catalog-v1 --json isDraft --jq .isDraft) == false ]]
            gh release upload runtime-catalog-v1 RuntimeCatalog/runtime-catalog.json RuntimeCatalog/runtime-catalog.json.sig --clobber
          fi
